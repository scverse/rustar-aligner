name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------
  # 0. Detect whether this is a release run (workflow_dispatch only)
  # ------------------------------------------------------------------
  check-release:
    name: Check release
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.check.outputs.version }}
      version_major: ${{ steps.check.outputs.version_major }}
      version_minor: ${{ steps.check.outputs.version_minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Detect release
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "Not a release run"
            exit 0
          fi

          # `grep '^version = '` (with the trailing space) so we don't also
          # match `rust-version = "..."`.
          RAW=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          VERSION="v${RAW}"
          echo "is_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Only emit short aliases (e.g. `0` and `0.2` Docker tags, `latest`)
          # for plain `X.Y.Z` releases — pre-releases like `0.2.0-rc1` must
          # not clobber stable tag moving-targets.
          if [[ "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            MAJOR=$(echo "$RAW" | cut -d. -f1)
            MINOR="${MAJOR}.$(echo "$RAW" | cut -d. -f2)"
            echo "version_major=$MAJOR" >> "$GITHUB_OUTPUT"
            echo "version_minor=$MINOR" >> "$GITHUB_OUTPUT"
          else
            echo "version_major=" >> "$GITHUB_OUTPUT"
            echo "version_minor=" >> "$GITHUB_OUTPUT"
          fi

          if git tag -l "$VERSION" | grep -q .; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

          LOCK_VERSION=$(awk '/^name = "rustar-aligner"/{found=1} found && /^version =/{print; exit}' Cargo.lock | sed 's/.*"\(.*\)"/\1/')
          if [ "$LOCK_VERSION" != "$RAW" ]; then
            echo "::error::Cargo.lock version ($LOCK_VERSION) does not match Cargo.toml version ($RAW)"
            exit 1
          fi

          echo "Detected release: $VERSION"

  # ------------------------------------------------------------------
  # 1. Build binaries for each target (always, to catch breakage)
  # ------------------------------------------------------------------
  build-binaries:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux targets are built with profile-guided optimization (`pgo:
          # true`): a fresh synthetic genome+reads fixture (scripts/../
          # src/bin/gen_pgo_fixture.rs) trains an instrumented build, which is
          # then rebuilt using that profile. ~10-20% faster alignment in
          # practice (see docs-old perf notes), output-identical to a plain
          # build. Restricted to Linux because these are the only matrix
          # entries that run NATIVELY on their own build runner — PGO needs to
          # execute the instrumented binary to collect a profile, which is not
          # possible for the cross-compiled targets below (e.g. macOS x86_64
          # built on an Apple Silicon runner).

          # Linux x86_64 (baseline)
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pgo: true

          # Linux x86_64 with AVX2 (x86-64-v3)
          - name: linux-x86_64-v3
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            target_cpu: x86-64-v3
            pgo: true

          # Linux x86_64 with AVX-512 (x86-64-v4).
          # PGO trains at v3 (AVX2) because GitHub runners do not reliably have
          # AVX-512 — running a v4-compiled instrumented binary SIGILLs (exit
          # 132). The shipped binary is still built at v4 (profiles transfer
          # across -Ctarget-cpu levels). See scripts/pgo-build.sh.
          - name: linux-x86_64-v4
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            target_cpu: x86-64-v4
            pgo_train_cpu: x86-64-v3
            pgo: true

          # Linux aarch64 (native arm64 runner, baseline)
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            pgo: true

          # Linux aarch64 with SVE (Graviton 3+, Axion, Grace).
          # PGO trains at the generic armv8-a baseline because the SVE (neoverse-v1)
          # instrumented binary would SIGILL on any aarch64 runner without SVE. The
          # shipped binary is still built at neoverse-v1 (profiles transfer across
          # -Ctarget-cpu levels). Same mechanism as linux-x86_64-v4.
          - name: linux-aarch64-neoverse-v1
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            target_cpu: neoverse-v1
            pgo_train_cpu: generic
            pgo: true

          # macOS x86_64 (cross-compiled on Apple Silicon runner)
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin

          # macOS aarch64 (Apple Silicon, baseline)
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin

          # macOS aarch64 (Apple M1 optimised)
          - name: macos-aarch64-apple-m1
            os: macos-latest
            target: aarch64-apple-darwin
            target_cpu: apple-m1

          # Windows x86_64 (baseline, MSVC toolchain)
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # ratchet:dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: ${{ matrix.pgo && 'llvm-tools' || '' }}

      - name: Build (PGO)
        if: matrix.pgo
        shell: bash
        run: |
          # Build a plain (non-instrumented, host-default-target) binary just to
          # generate the tiny synthetic training fixture and its genome index —
          # scripts/pgo-build.sh does the actual instrumented + profile-use
          # builds of the SHIPPED binary below.
          cargo build --release --bin gen_pgo_fixture --bin rustar-aligner
          FIXTURE_DIR="$(mktemp -d)"
          ./target/release/gen_pgo_fixture --out-dir "$FIXTURE_DIR" --n-reads 50000
          IDX_DIR="$(mktemp -d)"
          ./target/release/rustar-aligner --runMode genomeGenerate \
            --genomeDir "$IDX_DIR" --genomeFastaFiles "$FIXTURE_DIR/genome.fa" \
            --genomeSAindexNbases 8 --runThreadN 2
          PGO_TARGET="${{ matrix.target }}" \
          PGO_EXTRA_RUSTFLAGS="${TARGET_CPU:+-Ctarget-cpu=$TARGET_CPU}" \
          PGO_TRAIN_EXTRA_RUSTFLAGS="${PGO_TRAIN_CPU:+-Ctarget-cpu=$PGO_TRAIN_CPU}" \
            bash scripts/pgo-build.sh "$IDX_DIR" "$FIXTURE_DIR/reads.fastq" 50000
        env:
          TARGET_CPU: ${{ matrix.target_cpu || '' }}
          # ISA for the instrumented/training binary that actually runs on the
          # build machine. Falls back to the ship CPU when unset; overridden to
          # a runner-safe level (e.g. v3) for targets whose ISA the runner may
          # lack (v4/AVX-512).
          PGO_TRAIN_CPU: ${{ matrix.pgo_train_cpu || matrix.target_cpu || '' }}

      - name: Build
        if: ${{ !matrix.pgo }}
        shell: bash
        run: >
          cargo build --release --target ${{ matrix.target }}
          ${TARGET_CPU:+--config "target.'${{ matrix.target }}'.rustflags=['-C', 'target-cpu=$TARGET_CPU']"}
        env:
          TARGET_CPU: ${{ matrix.target_cpu || '' }}

      - name: Package
        id: package
        shell: bash
        run: |
          BIN="rustar-aligner"
          EXT="${{ matrix.ext }}"
          ARCHIVE="${BIN}-${{ matrix.name }}"

          mkdir -p "staging/${ARCHIVE}"
          cp "target/${{ matrix.target }}/release/${BIN}${EXT}" "staging/${ARCHIVE}/"
          cp README.md LICENSE "staging/${ARCHIVE}/" 2>/dev/null || true

          cd staging
          tar czf "../${ARCHIVE}.tar.gz" "${ARCHIVE}"
          cd ..

          # SHA256 checksum (shasum on macOS/Linux, sha256sum on Linux/Windows)
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          else
            shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          fi

          echo "archive=${ARCHIVE}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=${ARCHIVE}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # ratchet:actions/upload-artifact@v7.0.0
        with:
          name: binary-${{ matrix.name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          retention-days: 1

  # ------------------------------------------------------------------
  # 2. Build per-platform Docker images on native runners
  # ------------------------------------------------------------------
  docker-build:
    name: Docker ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # ratchet:docker/setup-buildx-action@v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short commit hash
        id: git-hash
        run: echo "short_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # ratchet:docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHORT_HASH=${{ steps.git-hash.outputs.short_hash }}
          outputs: type=image,name=ghcr.io/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # ratchet:actions/upload-artifact@v7.0.0
        with:
          name: digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------
  # 2a. Build SIMD-optimised Docker images (single-arch each)
  # ------------------------------------------------------------------
  docker-build-simd:
    name: Docker ${{ matrix.name }}
    needs: [check-release]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64-avx2
            runner: ubuntu-latest
            platform: linux/amd64
            cpu_target: x86-64-v3
            tag_suffix: avx2
          - name: amd64-avx512
            runner: ubuntu-latest
            platform: linux/amd64
            cpu_target: x86-64-v4
            tag_suffix: avx512
          - name: arm64-sve
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            cpu_target: neoverse-v1
            tag_suffix: sve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Prepare build metadata
        id: prep
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
          echo "short_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # ratchet:docker/setup-buildx-action@v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # ratchet:docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.check-release.outputs.version }}-${{ matrix.tag_suffix }},enable=${{ needs.check-release.outputs.is_release == 'true' }}
            type=raw,value=latest-${{ matrix.tag_suffix }},enable=${{ needs.check-release.outputs.version_minor != '' }}
            type=raw,value=dev-${{ matrix.tag_suffix }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # ratchet:docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_SHORT_HASH=${{ steps.prep.outputs.short_hash }}
            CPU_TARGET=${{ matrix.cpu_target }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # ------------------------------------------------------------------
  # 2b. Merge per-platform images into a multi-arch manifest
  # ------------------------------------------------------------------
  docker-merge:
    name: Docker merge
    needs: [check-release, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # ratchet:docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.check-release.outputs.version }},enable=${{ needs.check-release.outputs.is_release == 'true' }}
            type=raw,value=${{ needs.check-release.outputs.version_minor }},enable=${{ needs.check-release.outputs.version_minor != '' }}
            type=raw,value=${{ needs.check-release.outputs.version_major }},enable=${{ needs.check-release.outputs.version_major != '' }}
            type=raw,value=latest,enable=${{ needs.check-release.outputs.version_minor != '' }}
            type=raw,value=dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # ratchet:docker/setup-buildx-action@v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ env.IMAGE_NAME }}@sha256:%s ' *)

  # ------------------------------------------------------------------
  # 3. Create tag and draft release (release only, after all builds)
  # ------------------------------------------------------------------
  create-tag-and-release:
    name: Create tag and release
    if: needs.check-release.outputs.is_release == 'true'
    needs: [check-release, build-binaries, docker-merge, docker-build-simd]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.check-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Create tag
        run: |
          git tag "${{ needs.check-release.outputs.version }}"
          git push origin "${{ needs.check-release.outputs.version }}"

      - name: Extract changelog section
        id: notes
        run: |
          RAW="${{ needs.check-release.outputs.version }}"
          RAW="${RAW#v}"
          if awk '/^## \[Version '"$RAW"'\]/{found=1; next} /^## \[/{if(found) exit} found' CHANGELOG.md > /tmp/release-notes.md && [ -s /tmp/release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release (with changelog notes)
        if: steps.notes.outputs.has_notes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.check-release.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "rustar-aligner ${{ needs.check-release.outputs.version }}" \
            --notes-file /tmp/release-notes.md

      - name: Create release (auto-generated notes)
        if: steps.notes.outputs.has_notes == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.check-release.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "rustar-aligner ${{ needs.check-release.outputs.version }}" \
            --generate-notes

  # ------------------------------------------------------------------
  # 4. Upload binaries to the release
  # ------------------------------------------------------------------
  upload-binaries:
    name: Upload binaries
    if: needs.check-release.outputs.is_release == 'true'
    needs: [check-release, create-tag-and-release, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          pattern: binary-*
          path: /tmp/binaries
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.create-tag-and-release.outputs.tag }}" \
            /tmp/binaries/*.tar.gz \
            /tmp/binaries/*.sha256

  # ------------------------------------------------------------------
  # 5. Publish to crates.io (release only, last step)
  # ------------------------------------------------------------------
  publish-crate:
    name: Publish to crates.io
    if: needs.check-release.outputs.is_release == 'true'
    needs: [check-release, upload-binaries]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # ratchet:rust-lang/crates-io-auth-action@v1.0.5

      - name: Publish to crates.io
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
