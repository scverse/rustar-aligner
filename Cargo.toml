[package]
name = "rustar-aligner"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
authors = ["James Ferguson"]
description = "A Rust reimplementation of STAR (Spliced Transcripts Alignment to a Reference), the RNA-seq aligner"
license = "MIT"
repository = "https://github.com/scverse/rustar-aligner"
readme = "README.md"
keywords = ["bioinformatics", "rna-seq", "aligner", "sequencing", "star"]
categories = ["command-line-utilities", "science"]
exclude = [
    "test/",
    "tests/",
    "docs/",
    ".github/",
    "Dockerfile",
    ".dockerignore",
    "ROADMAP.md",
]

[[bin]]
name = "rustar-aligner"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
memmap2 = "0.9"
byteorder = "1"
noodles = { version = "0.116", features = ["fastq", "sam", "bam", "bgzf"] }
bstr = "1"
# `zlib-rs` backend rather than the default `miniz_oxide`: 2-3x faster
# inflate/deflate, still pure Rust. Rationale in DEPENDENCIES.md.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rayon = "1"
rustc-hash = "2"
dashmap = "6"
chrono = "0.4"
tempfile = "3"
bitflags = { version = "2.12.1", features = ["std"] }
shlex = "2.0.1"
caps-sa = "0.7"
# mimalloc as the global allocator: bounded allocator slack on
# genome-scale runs (glibc's per-thread arenas added 10-20 GB of peak
# RSS) and a lower per-allocation cost. `default-features = false`
# skips the secure/debug builds. Full rationale in DEPENDENCIES.md.
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1.49", features = ["extended"] } # mi_option_set (purge_delay); see main.rs
libdeflater = "1.25.2"
noodles-bgzf = { version = "0.51", features = ["libdeflate"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Whole-program LTO + a single codegen unit are worth the extra build time
# for the seed-search and DP-extension inner loops. Cargo warns about this
# profile being shadowed when rustar-aligner is built as a workspace member
# (the workspace root carries its own [profile.release] with the same
# values); keeping it here means standalone clones get the same release
# tuning even when there is no parent workspace.
# CI overrides these via `CARGO_PROFILE_RELEASE_LTO=thin` /
# `CODEGEN_UNITS=16` env vars to keep test-matrix runtime reasonable.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
