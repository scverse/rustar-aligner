[package]
name = "rustar-aligner"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
authors = ["James Ferguson"]
description = "A Rust reimplementation of STAR (Spliced Transcripts Alignment to a Reference), the RNA-seq aligner"
license = "MIT"
repository = "https://github.com/scverse/rustar-aligner"
readme = "README.md"
keywords = ["bioinformatics", "rna-seq", "aligner", "sequencing", "star"]
categories = ["command-line-utilities", "science"]
exclude = [
    "test/",
    "tests/",
    "docs/",
    ".github/",
    "Dockerfile",
    ".dockerignore",
    "ROADMAP.md",
]

[[bin]]
name = "rustar-aligner"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
memmap2 = "0.9"
byteorder = "1"
noodles = { version = "0.116", features = ["fastq", "sam", "bam", "bgzf"] }
bstr = "1"
nalgebra-sparse = { version = "0.11", optional = true }
# Use the pure-Rust `zlib-rs` backend instead of flate2's default `miniz_oxide`:
# ~2-3x faster inflate/deflate on the FASTQ decode + BGZF (BAM) paths, with no C
# toolchain dependency. Backend is chosen at build time; API is unchanged.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rayon = "1"
rustc-hash = "2"
dashmap = "6"
chrono = "0.4"
tempfile = "3"
bitflags = { version = "2.12.1", features = ["std"] }
shlex = "2.0.1"
caps-sa = "0.7"
# mimalloc as the global allocator. Two reasons:
#   1. **Memory return**: glibc malloc creates one arena per worker
#      thread (rayon spawns ~num_cpus workers + sub-threads) and
#      caches freed allocations in those arenas indefinitely. On
#      genome-scale runs that adds 10-20 GB of allocator slack to
#      peak RSS for no good reason. mimalloc's per-thread heaps
#      release whole segments back to the OS when threads abandon
#      them, so the cache size stays bounded.
#   2. **Speed**: mimalloc has lower per-allocation cost than
#      glibc's, which adds up on the millions of small allocations
#      caps-sa makes during phase 1 / phase 4.
# `default-features = false` skips the secure / debug builds (no
# extra cost in release, but the default features add a few hundred
# kB of fast-path stubs we don't need).
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1.49", features = ["extended"] } # mi_option_set (purge_delay); see main.rs
libdeflater = "1.25.2"
noodles-bgzf = { version = "0.51", features = ["libdeflate"] }

# --- AnnData/MuData output (--soloOutputFormat Zarr) -----------------------
# scverse/anndata-rs. Optional because the tree is heavy (polars for the
# obs/var DataFrames, zarrs for the Zarr v3 store). `--no-default-features`
# gives back the lean aligner-only build; `--soloOutputFormat` then only
# accepts `MTX`.
#
# `nalgebra-sparse` / `polars` are pinned to the versions anndata 0.7 depends
# on — the `CsrMatrix` and `DataFrame` we hand to it must be the *same* types.
anndata = { version = "0.7", optional = true }
anndata-zarr = { version = "0.2", optional = true }
polars = { version = "0.53", default-features = false, optional = true }

[features]
default = ["anndata-out"]
# Shared plumbing for AnnData backend.
anndata-out = ["dep:anndata", "dep:nalgebra-sparse", "dep:polars", "dep:anndata-zarr"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# Reading back the hand-written Zarr group metadata in the MuData output test.
serde_json = "1"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Whole-program LTO + a single codegen unit are worth the extra build time
# for the seed-search and DP-extension inner loops. Cargo warns about this
# profile being shadowed when rustar-aligner is built as a workspace member
# (the workspace root carries its own [profile.release] with the same
# values); keeping it here means standalone clones get the same release
# tuning even when there is no parent workspace.
# CI overrides these via `CARGO_PROFILE_RELEASE_LTO=thin` /
# `CODEGEN_UNITS=16` env vars to keep test-matrix runtime reasonable.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# `obsm`/`varm` DataFrames only get their index (the `obs`/`var` names) stamped
# on by anndata-rs `ig/set_index`, which is what the solo Zarr writer relies on.
# Drop this section once that lands in a crates.io release.
[patch.crates-io]
anndata = { path = "../anndata-rs/anndata" }
anndata-zarr = { path = "../anndata-rs/anndata-zarr" }
